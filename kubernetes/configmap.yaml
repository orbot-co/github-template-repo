apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  db_host: "postgres.default.svc.cluster.local"
  db_name: "project_prod"
  db_port: "5432"
  redis_url: "redis://redis.default.svc.cluster.local:6379"
  log_level: "info"
  node_env: "production"
  api_timeout: "30000"
  cache_ttl: "3600"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
stringData:
  db_user: "postgres"
  db_password: "your_secure_password_here"
  jwt_secret: "your_jwt_secret_here"
  api_key: "your_api_key_here"
