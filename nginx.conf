user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Only forward WebSocket upgrades; any other Upgrade value (e.g. h2c) is dropped.
    map $http_upgrade $ws_upgrade {
        default "";
        "~*^websocket$" websocket;
    }

    map $ws_upgrade $ws_connection {
        default "";
        websocket upgrade;
    }

    upstream backend {
        server app:3000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        # Health check endpoint
        location /health {
            access_log off;
            # Set the type via default_type: a header directive here would drop the server-level security headers
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Proxy to application
        location / {
            proxy_pass http://backend;
            # $ws_upgrade is "websocket" or empty (see map above), so h2c upgrades never reach the app.
            # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Upgrade $ws_upgrade;
            proxy_set_header Connection $ws_connection;
            # Set server_name to your real domain in production; the app must not trust Host for URLs or redirects.
            # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $ws_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
